<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Офлайн-тренажер для механіка-електрика: план навчання, уроки, тести, лабораторія ПЛК, підготовка до іспиту Red Seal.">
<meta name="theme-color" content="#00708d">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Тренажер">
<title>Тренажер техобслуговування</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: одна колонка до 720px; жовто-чорна смуга техзони, липка панель вкладок, картки модулів і уроки нижче */
  --bg:#eef1f3; --surface:#ffffff; --ink:#15212b; --muted:#5a6772; --line:#d3dae0;
  --accent:#00708d; --accent-soft:#e0eff3; --on-accent:#ffffff;
  --good:#1d7a3c; --good-soft:#e2f2e7; --bad:#b3261e; --bad-soft:#fbe6e4; --warn:#8a5a00; --warn-soft:#fbf0d6;
  --hazard:#f2b705; --hazard-dark:#15212b;
  --font-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --radius:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f151a; --surface:#172028; --ink:#e5ebef; --muted:#94a2ad; --line:#2b3842;
    --accent:#3db4d2; --accent-soft:#15313a; --on-accent:#06212a;
    --good:#55c682; --good-soft:#14301e; --bad:#ff7d72; --bad-soft:#3b1b19; --warn:#f0b84a; --warn-soft:#352812;
    --hazard:#e0a800; --hazard-dark:#0f151a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f151a; --surface:#172028; --ink:#e5ebef; --muted:#94a2ad; --line:#2b3842;
  --accent:#3db4d2; --accent-soft:#15313a; --on-accent:#06212a;
  --good:#55c682; --good-soft:#14301e; --bad:#ff7d72; --bad-soft:#3b1b19; --warn:#f0b84a; --warn-soft:#352812;
  --hazard:#e0a800; --hazard-dark:#0f151a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--accent);text-underline-offset:3px}
.hazard{height:8px;background:repeating-linear-gradient(-45deg,var(--hazard) 0 12px,var(--hazard-dark) 12px 24px)}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 48px;display:grid;gap:14px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
header .t{display:grid;gap:4px;flex:1 1 260px}
h1{font-family:var(--font-display);font-weight:700;font-size:28px;line-height:1.1;margin:0;text-wrap:balance}
.lead{margin:0;color:var(--muted);font-size:15px;max-width:62ch}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:6px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
nav.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 4px;min-height:44px;font-weight:500;font-size:14px}
nav.tabs button[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:grid;gap:14px;min-width:0}
.label{font-family:var(--font-display);font-weight:600;font-size:13px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.m0{margin:0}
.measure{margin:0;max-width:65ch}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.45}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 12px;font-size:14px;display:inline-flex;gap:6px;align-items:center;min-height:38px}
.chip .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:500}
.chip[aria-pressed="true"] .n{color:var(--accent)}
.link{border:0;background:none;padding:4px 2px;color:var(--accent);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 14px;min-height:40px;font-variant-numeric:tabular-nums}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);border-radius:8px;padding:11px 18px;font-weight:600;min-height:46px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.wide{flex:1 1 200px}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;white-space:nowrap;border:1px solid var(--line);color:var(--muted)}
.pill.ok{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.pill.no{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.pill.read{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* resume banner */
.resume{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:15px}
.resume .btn{min-height:40px;padding:7px 16px}
/* modules */
.mods{display:grid;gap:8px}
.mod{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:4px 12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:12px 14px;min-height:64px}
.mod:hover{border-color:var(--accent)}
.mod .no{grid-row:span 2;display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-family:var(--font-display);font-weight:700;font-size:17px}
.mod .nm{font-weight:600;line-height:1.3}
.mod .meta{grid-column:2;font-size:13px;color:var(--muted)}
.mod .pill{grid-column:3;grid-row:1 / span 2}
/* lesson */
.lesson h2{font-family:var(--font-display);font-size:26px;line-height:1.15;margin:0;text-wrap:balance}
.lesson h3{font-size:17px;margin:0}
.lesson .intro{margin:0;max-width:65ch}
.lesson ul{margin:0;padding-left:20px;display:grid;gap:6px;max-width:65ch}
.blk{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:14px}
dl.terms{margin:0;display:grid;gap:10px}
dl.terms div{display:grid;gap:2px}
dl.terms dt{font-weight:600}
dl.terms dt .ua{font-weight:400;color:var(--muted)}
dl.terms dd{margin:0;font-size:15px}
ul.src{list-style:none;padding:0;margin:0;display:grid;gap:10px}
ul.src li{display:grid;gap:2px}
ul.src .st{font-weight:600}
ul.src .sd{font-size:14px;color:var(--muted)}
/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;font-size:14px;color:var(--muted)}
.tag{justify-self:start;font-family:var(--font-display);font-weight:600;font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:2px 8px}
.q{font-size:19px;font-weight:600;line-height:1.4;margin:0;text-wrap:pretty}
.q:focus{outline:none}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px;min-height:48px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.opt:disabled{cursor:default;opacity:1}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.correct .k{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.dim{opacity:.6}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .k{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.kbd-hint{display:none;margin:0}
@media (hover:hover) and (pointer:fine){.kbd-hint{display:block}}
.explain{border-left:4px solid var(--good);background:var(--good-soft);border-radius:0 8px 8px 0;padding:12px 14px;display:grid;gap:6px}
.explain.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.explain h3{margin:0;font-size:16px}
.explain p{margin:0}
.warnbox{border-left:4px solid var(--warn);background:var(--warn-soft);border-radius:0 8px 8px 0;padding:12px 14px;display:grid;gap:10px}
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.score b{font-family:var(--font-display);font-size:48px;line-height:1;font-variant-numeric:tabular-nums}
.miss{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.miss li{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:4px}
.miss .ans{color:var(--good);font-weight:600}
.miss .yours{color:var(--bad)}
.stats{display:grid;gap:10px}
.stat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:14px}
.stat .meter{grid-column:1 / -1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;position:relative}
.stat .meter i{display:block;height:100%;border-radius:3px}
.stat .meter::after{content:"";position:absolute;left:70%;top:0;bottom:0;width:2px;background:var(--ink);opacity:.35}
/* mock exam */
.h2s{font-family:var(--font-display);font-size:22px;line-height:1.15;margin:0;text-wrap:balance}
.panel{border:1px solid var(--line);background:var(--bg);border-radius:var(--radius);padding:0 14px 14px;display:grid;gap:12px;overflow:hidden}
.panel::before{content:"";height:6px;margin:0 -14px 2px;background:repeating-linear-gradient(-45deg,var(--hazard) 0 10px,var(--hazard-dark) 10px 20px)}
.qnav{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:4px}
.qnav button{min-height:34px;padding:0;border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}
.qnav button.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.qnav button[aria-current]{outline:2px solid var(--ink);outline-offset:1px;color:var(--ink)}
/* diagrams, plan, practice */
.diag{margin:0;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);overflow-x:auto}
.diag svg{display:block;width:100%;max-width:480px;height:auto;margin:0 auto;overflow:visible}
.diag .s{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.diag .h{fill:none;stroke:var(--accent);stroke-width:2.6;stroke-linecap:round}
.diag .f{fill:var(--ink)}
.diag text{fill:var(--ink);font-family:var(--font-body);font-size:17px}
.diag text.hl{fill:var(--accent);font-weight:600}
.diag text.sm{font-size:14px;fill:var(--muted)}
.diag figcaption{margin-top:6px;text-align:center;font-size:13px;color:var(--muted)}
.stage{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.tasks{display:grid;gap:4px}
.task{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;padding:6px 0;cursor:pointer}
.task input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);cursor:pointer}
/* PLC lab */
.lab{display:grid;gap:12px;border-top:1px solid var(--line);padding-top:14px;min-width:0}
.labio{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
.iobox{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:10px;align-content:start;background:var(--bg);min-width:0}
.io{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap}
.io-d{min-width:26px;color:var(--muted)}
.led{flex:none;width:14px;height:14px;border-radius:50%;background:var(--line);border:1px solid var(--muted)}
.led.on{background:var(--good);border-color:var(--good);box-shadow:0 0 0 3px var(--good-soft)}
.led.out.on{background:var(--hazard);border-color:var(--hazard);box-shadow:0 0 0 3px var(--warn-soft)}
.pbtn{border:1px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:8px;padding:8px 14px;min-height:44px;font-weight:600;touch-action:none;user-select:none;-webkit-user-select:none}
.pbtn.down{background:var(--accent);color:var(--on-accent)}
.ladder{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:4px}
.ladder svg{display:block;max-width:100%;height:auto}
.ladder .w{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.ladder .rail{stroke-width:3}
.ladder .cell{fill:transparent}
.ladder .cell.on{fill:var(--accent)}
.ladder .coil.on{fill:var(--accent-soft);stroke:var(--accent);stroke-width:3}
.ladder text{fill:var(--ink);font-family:var(--font-body);font-size:13px;font-variant-numeric:tabular-nums}
.ladder text.cm{fill:var(--muted);font-size:12px}
.cyl{display:block;width:100%;max-width:420px;height:auto}
.cyl .w{fill:none;stroke:var(--ink);stroke-width:2}
.cyl .rod{fill:var(--muted)}
.cyl .sen{fill:var(--line);stroke:var(--muted);stroke-width:1.5}
.cyl .sen.on{fill:var(--good);stroke:var(--good)}
.cyl text{fill:var(--ink);font-family:var(--font-body);font-size:13px}
/* terms & sources */
input.search{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;width:100%}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:13px}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
ul.facts{margin:0;padding-left:20px;display:grid;gap:6px}
footer{font-size:13px;color:var(--muted);display:grid;gap:6px}
.sync{display:inline-flex;align-items:center;gap:8px}
.sync i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.on i{background:var(--good)}
.sync.err i{background:var(--warn)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (max-width:420px){h1{font-size:24px}.q{font-size:18px}.card{padding:16px}nav.tabs button{font-size:13px}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>

<div class="hazard" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <div class="t"><h1 id="title"></h1><p class="lead" id="lead"></p></div>
    <div class="seg" role="group" aria-label="Мова / Language" id="langSeg">
      <button data-act="lang" data-lang="uk">УКР</button><button data-act="lang" data-lang="en">EN</button>
    </div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Розділи"></nav>
  <main id="app" class="card"></main>
  <div id="live" class="sr-only" aria-live="polite"></div>
  <footer><span id="footText"></span><span id="sync" class="sync"><i aria-hidden="true"></i><span id="syncText"></span></span></footer>
</div>

<script>
const OFFLINE_APP = true;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); window.__installEvt = e; if (typeof render === "function") render(); });
window.addEventListener("appinstalled", () => { window.__installEvt = null; });
</script>
<script>
/* Формат питання: [uk_питання, [uk_правильна, uk_хибні…], uk_пояснення, en_question, [en_correct, en_wrong…], en_explanation]
   Перший варіант — правильний; при показі варіанти перемішуються. Нові питання додаються лише в кінець модуля (id = модуль-номер). */
const Q = {};
Q.safety = [
["З чого починається процедура блокування й маркування (LOTO)?",
 ["Визначити всі джерела енергії машини й попередити людей, яких це стосується","Повісити свій замок на вимикач","Перевірити відсутність напруги тестером","Зняти захисні кожухи"],
 "Порядок LOTO: підготовка (усі джерела енергії: електрика, пневматика, гідравліка, гравітація, пружини) → попередження → зупинка → ізоляція → замок і бирка → скидання накопиченої енергії → перевірка (спроба пуску і вимірювання).",
 "What is the first step of a lockout/tagout (LOTO) procedure?",
 ["Identify every energy source of the machine and notify affected people","Hang your lock on the disconnect","Test for absence of voltage","Remove the guards"],
 "LOTO order: prepare (all energy sources: electrical, pneumatic, hydraulic, gravity, springs) → notify → shut down → isolate → lock and tag → release stored energy → verify (try to start and test)."],
["Навіщо перевіряти тестер на відомому джерелі напруги до і після вимірювання (live-dead-live)?",
 ["Щоб «0 В» точно означало відсутність напруги, а не зламаний прилад чи щуп","Щоб відкалібрувати прилад","Щоб розрядити конденсатори","Так вимагає лише виробник тестера"],
 "Обірваний щуп або перегорілий запобіжник у мультиметрі покаже 0 В на живому колі. Перевірка до і після підтверджує, що прилад працював протягом усього вимірювання.",
 "Why test your meter on a known live source before and after the measurement (live-dead-live)?",
 ["So that “0 V” really means no voltage, not a broken meter or lead","To calibrate the meter","To discharge capacitors","Only the meter manufacturer requires it"],
 "A broken lead or a blown meter fuse reads 0 V on a live circuit. Testing before and after proves the meter worked during the whole measurement."],
["Ти вимкнув і заблокував частотний перетворювач. Що ще треба врахувати перед роботою з його клемами?",
 ["Конденсатори DC-шини ще кілька хвилин тримають небезпечну напругу","Нічого, після вимкнення ЧП одразу безпечний","Треба лише вимкнути вентилятор","Небезпечні лише вихідні клеми U/V/W, вхідні можна чіпати"],
 "На корпусі ЧП зазвичай вказано час розряду (часто 5–15 хв). Почекай цей час і виміряй напругу між DC+ і DC− перед роботою.",
 "You have switched off and locked out a VFD. What else must you consider before touching its terminals?",

["Які оберти взяти для свердла 10 мм зі швидкорізальної сталі по звичайній сталі (швидкість різання ≈ 25 м/хв)?",

 "What speed for a 10 mm HSS drill in mild steel (cutting speed ≈ 25 m/min)?",

 "You double the drill diameter. How should the speed change for the same cutting speed?",

 "Harmonics add heat in the windings and core. K-rated transformers have heavier windings and neutral. The alternative is derating a standard transformer."],
["Для чого пристрій захисту від імпульсних перенапруг (SPD)?",
 ["Обмежує короткі сплески напруги від блискавки й комутацій, відводячи їх на землю","Захищає від перевантаження","Захищає від витоку на землю","Покращує cos φ"],
 "SPD працює мікросекунди й не замінює автомат чи GFCI. Його ефективність залежить від коротких з’єднувальних проводів і доброго заземлення.",
 "What is a surge protective device (SPD) for?",
 ["It clamps short voltage spikes from lightning and switching, diverting them to ground","Overload protection","Ground-fault protection","Power factor correction"],

 ["12","6","20","Без обмежень"],

 "What is the maximum number of outlets on a 2-wire branch circuit under the CEC, absent exceptions?",

["Що вимагає правило 2-024 CEC щодо обладнання?",
 ["Використовувати лише схвалене (сертифіковане) обладнання, наприклад із маркуванням CSA чи cUL","Купувати лише канадське","Обладнання має бути новим","Маркувати кожен кабель"],
 "Несертифіковане обладнання (часто з інтернет-магазинів) інспектор може заборонити. Перевіряй знак акредитованої організації на табличці.",

["Яка орієнтовна межа потужності кіл класу 2 (секція 16)?",

 "What is the approximate power limit of a Class 2 circuit (Section 16)?",
 ["≈ 100 VA","≈ 1000 VA","≈ 10 VA","No limit"],
 "Class 2 sources (such as 24 V DC supplies marked Class 2) are power-limited, so fire and shock risk is low. Wiring rules are relaxed, but they may not share space with power conductors without separation."]

MODULES.push(
{ id:"basicel", mwa:"B", title:["Електрика з нуля","Electricity from scratch"],

    ["Опір провідника росте з довжиною й температурою і падає зі збільшенням перерізу. В AWG менший номер — товстіший провід.","Conductor resistance rises with length and temperature and falls as size grows. In AWG a smaller number is a thicker wire."]]],
   [["Мультиметр","The multimeter"],[

    ["Спершу обери режим і гнізда, потім торкайся щупами. Після вимірювання струму поверни щуп у гніздо V.","Set the function and jacks before touching the circuit. After measuring current, move the lead back to the V jack."],

   [["Пошук обриву","Finding an open"],[

   [["Інші вимірювальні інструменти","Other measuring tools"],[

   [["Ручний інструмент","Hand tools"],[
    ["Ножівка: зубцями вперед; тонкий метал — дрібний зуб (щонайменше 3 зубці в матеріалі).","Hacksaw: teeth forward; thin stock needs fine teeth (at least 3 teeth in the material)."],

    ["Динамометричний ключ після роботи — на мінімум шкали. Ізольований інструмент має знак подвійного трикутника й «1000 V».","Set a torque wrench to its lowest value after use. Insulated tools carry the double-triangle mark and “1000 V”."]]]

  refs:["machinery"] },

{ id:"drill", mwa:"A", title:["Свердління, різьба й заточування","Drilling, tapping and sharpening"],
  intro:["Як вибрати оберти, вручну заточити свердло на точилі, нарізати різьбу мітчиком і не травмуватися на верстаті.",
         "How to pick drill speed, sharpen a drill by hand on a bench grinder, tap a thread and stay safe at the machine."],
  blocks:[
   [["Будова свердла","Drill geometry"],[
    ["Кут при вершині: 118° — загальний для сталі, 135° — для твердих і нержавіючих сталей.","Point angle: 118° for general steel work, 135° for hard and stainless steels."],
    ["Обидві ріжучі кромки однакової довжини й під однаковим кутом (по 59° до осі при 118°).","Both lips equal in length and angle (59° each to the axis at 118°)."],
    ["Задній кут за кромкою ≈ 8–12°: без нього свердло тре, а не ріже. Ознака правильного заднього кута — кут перемички ≈ 120–135°.","Lip relief ≈ 8–12° behind the edge: without it the drill rubs instead of cutting. A chisel-edge angle of ≈ 120–135° shows correct relief."]]],
   [["Заточування на точилі","Sharpening on a bench grinder"],[
    ["Перевір круг і підручник: зазор до 3 мм, щиток до 6 мм, окуляри або щиток на обличчя.","Check the wheel and tool rest: gap up to 3 mm, tongue guard up to 6 mm, safety glasses or face shield."],
    ["Тримай свердло під 59° до робочої поверхні круга, кромку горизонтально. Легко притисни кромку й одним плавним рухом опусти хвостовик донизу, трохи повертаючи свердло: так утворюється задній кут.","Hold the drill at 59° to the wheel face with the lip horizontal. Touch the lip lightly and, in one smooth motion, drop the shank while rotating slightly to form the relief."],
    ["Поверни свердло на 180° і тим самим рухом заточи другу кромку. Часто охолоджуй HSS у воді; синій колір — перегрів.","Turn the drill 180° and grind the second lip with the same motion. Cool HSS in water often; blue means overheated."],
    ["Перевір шаблоном кут і довжину кромок. Пробний отвір покаже результат: однакова стружка з обох канавок — заточено правильно.","Check angle and lip length with a gauge. A test hole tells you: equal chips from both flutes means a good grind."]]],
   [["Режими свердління","Drilling speeds"],[
    ["n = 1000 × Vc / (π × D). Для HSS по сталі Vc ≈ 25 м/хв, тож n ≈ 8000 / D (мм).","n = 1000 × Vc / (π × D). For HSS in steel Vc ≈ 25 m/min, so n ≈ 8000 / D (mm)."],
    ["Більший діаметр — менші оберти. Алюміній — вищі, нержавійка — нижчі оберти й рівна постійна подача.","Larger diameter, lower speed. Aluminium faster; stainless slower with steady feed."],
    ["Накерни центр; великі отвори — спершу пілотним свердлом. Деталь — у лещата, без рукавиць біля шпинделя.","Centre-punch first; drill big holes with a pilot. Clamp the work and wear no gloves near the spindle."]]],
   [["Різьба","Tapping"],[

    ["Мітчики: чорновий → середній → чистовий. Оберт уперед, пів назад, з мастилом.","Taps: taper → plug → bottoming. One turn forward, half back, with cutting oil."],
    ["Отвори в щитах роблять пробійником: для вводу труби 1/2″ — 7/8″.","Enclosure holes are made with a knockout punch: 7/8 in for a 1/2 in conduit connector."]]]

{ id:"bear0", mwa:"D", title:["Підшипники з нуля","Bearings from scratch"],
  intro:["З самого початку: навіщо підшипник, які бувають, як прочитати номер, як правильно зняти й поставити. Модуль «Механіка й мастила» продовжує цю тему.",
         "From the very start: what a bearing does, the main types, how to read the number, how to remove and fit one. The Mechanical and lubrication module continues from here."],
  blocks:[
   [["Типи й навантаження","Types and loads"],[
    ["Радіальне навантаження — поперек вала, осьове — уздовж. Підшипник обирають під обидва.","Radial load acts across the shaft, axial along it. A bearing is chosen for both."],
    ["Кульковий радіальний (6xxx) — універсальний. Циліндричний роликовий (NU, N) — велике радіальне навантаження й осьове зміщення вала.","Deep-groove ball (6xxx) is the all-rounder. Cylindrical roller (NU, N) carries heavy radial load and lets the shaft float axially."],
    ["Конічний роликовий — радіальне й осьове в один бік, ставлять парами. Сферичний роликовий — важке навантаження з перекосом. Упорний — лише осьове. Голчастий — коли мало місця по висоті.","Tapered roller: radial plus one-way axial, fitted in pairs. Spherical roller: heavy load with misalignment. Thrust: axial only. Needle: when radial space is tight."],
    ["Підшипники ковзання (втулки, вкладиші) працюють на мастильній плівці: для них критичні тиск і чистота мастила.","Plain bearings (bushings, shells) run on an oil film: oil pressure and cleanliness are critical."]]],
   [["Номер підшипника","Reading the number"],[
    ["6205: 6 — кульковий радіальний, 2 — серія, 05 — отвір 25 мм. Коди 00–03: 10, 12, 15, 17 мм; від 04 — код × 5.","6205: 6 deep-groove ball, 2 series, 05 bore 25 mm. Codes 00–03: 10, 12, 15, 17 mm; from 04, code × 5."],
    ["60xx, 62xx, 63xx — той самий отвір, дедалі важча серія.","60xx, 62xx, 63xx: same bore, heavier series."],
    ["2RS — гумові ущільнення, 2Z (ZZ) — металеві щитки, C3 — збільшений зазор, N — канавка під стопорне кільце, K — конічний отвір.","2RS rubber seals, 2Z (ZZ) metal shields, C3 increased clearance, N snap-ring groove, K tapered bore."]]],
   [["Фіксуюча й плаваюча опори","Locating and floating supports"],[
    ["Одна опора фіксує вал уздовж осі, друга плаває, щоб вал міг видовжуватися від нагріву.","One support locates the shaft axially; the other floats so the shaft can grow with heat."],
    ["Натяг ставлять на кільце, що обертається відносно навантаження, — зазвичай внутрішнє на валу.","The interference fit goes on the ring that rotates relative to the load, usually the inner ring on the shaft."]]],
   [["Монтаж, демонтаж, діагностика","Fitting, removal, diagnosis"],[
    ["Чистота понад усе. Знімач тягне за кільце з натягом; ніколи не бий по тілах кочення й сепаратору.","Cleanliness first. The puller pulls on the tight ring; never hit the rolling elements or cage."],
    ["Не розкручуй підшипник стисненим повітрям. Закриті підшипники не миють.","Never spin a bearing with compressed air. Sealed bearings are not washed."],
    ["Свист — мастило; гуркіт — доріжки; стукіт — зазор чи провертання кільця. Порівнюй з такою самою машиною.","Squeal: lubrication; rumble: raceways; knock: clearance or a spinning ring. Compare with an identical machine."],

{ id:"wiring", mwa:"C", title:["Електропроводки","Wiring systems"],

         "Block C (wiring systems) is 20% of the exam. It covers cables and raceways, sizing conductors from CEC tables, correction factors, conduit fill and hazardous locations."],

   [["Вибір перерізу","Sizing conductors"],[
    ["Таблиця 1 — одиночні провідники в повітрі, таблиця 2 — мідні, не більше 3 у трубі чи кабелі (30 °C). Таблиці 3 і 4 — алюміній.","Table 1: single conductors in free air; Table 2: copper, not more than 3 in raceway or cable (30 °C). Tables 3 and 4: aluminium."],
    ["Поправки: таблиця 5A — температура понад 30 °C, таблиця 5C — понад 3 провідники в трубі (4–6: 0,8; 7–24: 0,7).","Corrections: Table 5A for ambient over 30 °C, Table 5C for more than 3 conductors in a raceway (4–6: 0.8; 7–24: 0.7)."],

/* bands: масив [uk, en, колір]; повертає SVG резистора й підпис із назвами кольорів */
function resistorSvg(bands, lg) {
  const xs = [104, 132, 160, 214];
  const rects = bands.map((b, i) => `<rect x="${xs[i]}" y="22" width="14" height="36" style="fill:${b[2]};stroke:rgba(0,0,0,.35);stroke-width:1"/>`).join("");
  const names = bands.map(b => b[lg === "en" ? 1 : 0]).join(", ");
  return `<svg viewBox="0 0 320 80" role="img" aria-label="${(lg === "en" ? "Resistor, bands: " : "Резистор, смуги: ") + names}"><path d="M10 40H310" style="stroke:var(--muted);stroke-width:4;stroke-linecap:round"/><rect x="70" y="20" width="180" height="40" rx="18" style="fill:#e8d2a6;stroke:#8a6d3b;stroke-width:1.5"/>${rects}</svg><figcaption>${lg === "en" ? "Bands" : "Смуги"}: ${names}</figcaption>`;
}

 "Симістор — як два зустрічні тиристори в одному корпусі. Він стоїть у диммерах, регуляторах обертів малих двигунів і багатьох твердотільних реле на змінний струм.",
 "What is a TRIAC?",
 ["A switch that conducts AC in both directions","A bidirectional DC transistor","A capacitor type","A protection diode"],
 "A TRIAC is like two back-to-back SCRs in one package. It is used in dimmers, small motor speed controls and many AC solid-state relays."],
["Які ключі стоять в інверторі сучасного частотного перетворювача?",
 ["IGBT","Тиристори","Реле","Лампи"],
 "IGBT поєднує просте керування затвором, як у MOSFET, з великими струмами й напругами. Інвертор має шість таких ключів зі зворотними діодами.",
 "What switches are in the inverter of a modern VFD?",
 ["IGBTs","SCRs","Relays","Vacuum tubes"],
 "An IGBT combines easy gate drive, like a MOSFET, with high current and voltage. The inverter has six of them with freewheeling diodes."],
["Як найчастіше відмовляє твердотільне реле (SSR)?",
 ["«Залипає» замкненим: вихід лишається ввімкненим","Розмикається назавжди","Починає мигати","Ніколи не відмовляє"],
 "Тому SSR не вважають засобом ізоляції й не покладаються на нього в колах безпеки. Нагрівачі з SSR зазвичай мають ще й незалежний захист від перегріву з контактором.",
 "How does a solid-state relay (SSR) most often fail?",
 ["Shorted: the output stays on","Open for good","It starts flashing","It never fails"],
 "So an SSR is never treated as isolation or trusted in safety circuits. Heaters switched by SSRs usually have an independent over-temperature cutout with a contactor."],
["Що потрібно твердотільному реле, яке комутує 25 А?",
 ["Радіатор, бо на ньому падає ≈ 1–1,5 В і виділяється тепло","Нічого, воно не гріється","Паралельний конденсатор","Окремий трансформатор"],
 "Тепло ≈ падіння × струм: 1,2 В × 25 А ≈ 30 Вт. Без радіатора й термопасти SSR перегріється й залипне.",
 "What does an SSR switching 25 A need?",
 ["A heatsink, because it drops ≈ 1–1.5 V and makes heat","Nothing, it doesn’t heat up","A parallel capacitor","A separate transformer"],
 "Heat ≈ drop × current: 1.2 V × 25 A ≈ 30 W. Without a heatsink and thermal paste the SSR overheats and fails shorted."],
["ЧП знеструмлений, заблокований і DC-шина розряджена. Як перевірити вхідний випрямляч?",
 ["Діодним тестом між вхідними клемами L1, L2, L3 і клемами DC+ / DC−","Мегомметром на 1000 В між усіма клемами","Омметром на корпус","Лише заміною ЧП"],
 "Кожен діод моста має проводити в один бік (≈ 0,3–0,5 В на тесті) і показувати OL у зворотному. Так само перевіряють зворотні діоди IGBT на вихідних клемах U, V, W. Мегомметром електроніку ЧП не перевіряють.",
 "A VFD is off, locked out and its DC bus discharged. How do you check the input rectifier?",
 ["Diode test between input terminals L1, L2, L3 and the DC+ / DC− terminals","A 1000 V megger across all terminals","An ohmmeter to the chassis","Only by replacing the drive"],
 "Each bridge diode should conduct one way (≈ 0.3–0.5 V on the meter) and read OL the other. The IGBT freewheeling diodes are checked the same way at U, V, W. Never megger a drive’s electronics."],
["Навіщо в ЧП гальмівний транзистор (чопер) і резистор?",
 ["Щоб скидати в тепло енергію, яку двигун повертає під час гальмування, і не допустити перенапруги DC-шини","Щоб розганяти двигун","Щоб гасити завади","Щоб заряджати конденсатори при пуску"],
 "Коли напруга DC-шини росте вище порогу, чопер вмикає резистор. Гарячий гальмівний резистор — нормально, але його перегрів означає надто швидке чи часте гальмування.",
 "Why does a VFD have a brake transistor (chopper) and resistor?",
 ["To dump the energy the motor returns while braking as heat, preventing DC bus overvoltage","To accelerate the motor","To suppress noise","To charge the capacitors at start"],
 "When the DC bus rises above a threshold, the chopper switches in the resistor. A warm brake resistor is normal; an overheating one means braking is too fast or too frequent."],
["Резистор на платі виміряли, не випаюючи, і показ менший за номінал. Чому?",
 ["Паралельно до нього підключені інші елементи плати","Мультиметр завжди занижує","Резистор холодний","Так вимірюють правильно"],
 "Омметр бачить усі шляхи між щупами. Для точного вимірювання випаюють один вивід. Показ більший за номінал майже завжди означає несправний резистор.",
 "A resistor measured in-circuit reads below its marked value. Why?",
 ["Other parts on the board are in parallel with it","Meters always read low","The resistor is cold","That is the correct reading"],
 "An ohmmeter sees every path between its probes. For an accurate reading, lift one lead. A reading above the marked value almost always means a bad resistor."],
["Як перевірити біполярний транзистор мультиметром у режимі діода?",
 ["Як два діоди: база — емітер і база — колектор проводять в один бік, а колектор — емітер не проводить","Тільки спеціальним тестером","Омметром між усіма виводами, мають бути нулі","Ніяк"],
 "У NPN плюс щупа на базі дає ≈ 0,6 В до емітера й до колектора. Близько 0 В між колектором і емітером означає пробій.",
 "How do you check a bipolar transistor with the diode test?",
 ["As two diodes: base–emitter and base–collector conduct one way, collector–emitter doesn’t","Only with a special tester","Ohmmeter across all leads should read zero","You can’t"],
 "On an NPN, the red probe on the base reads ≈ 0.6 V to both emitter and collector. Near 0 V collector to emitter means it is shorted."],
["Навіщо антистатичний браслет під час роботи з платами?",
 ["Щоб статичний заряд із тіла не пошкодив чутливі мікросхеми й транзистори","Щоб захиститися від ураження мережевою напругою","Щоб плата не грілася","Для краси"],
 "Розряд, якого ти навіть не відчуваєш, може пошкодити MOSFET чи мікросхему. Браслет підключають до заземленої точки, плати беруть за краї й зберігають в антистатичних пакетах. Від мережевої напруги браслет не захищає.",
 "Why wear an antistatic wrist strap when handling boards?",
 ["So static charge from your body doesn’t damage sensitive chips and transistors","To protect against line-voltage shock","To keep the board cool","For looks"],
 "A discharge you can’t even feel can damage a MOSFET or a chip. Clip the strap to a grounded point, hold boards by the edges and store them in antistatic bags. It gives no protection from line voltage."],
["Як виглядає «холодна» пайка?",
 ["Сіра, зерниста, з тріщинами чи кулькою, що не розтеклася","Гладка й блискуча, у формі увігнутого конуса","Невидима","Чорна від флюсу"],
 "Холодна пайка має поганий контакт і з часом тріскається від вібрації й нагріву. Безсвинцевий припій від природи матовіший, але має добре розтектися по площадці й виводу.",
 "What does a cold solder joint look like?",
 ["Grey, grainy, cracked or balled up without wetting","Smooth and shiny, a concave cone","Invisible","Black with flux"],
 "A cold joint makes poor contact and cracks over time from vibration and heat. Lead-free solder is naturally duller, but it should still wet both the pad and the lead."],
["Як правильно паяти вивід на платі?",
 ["Нагріти одночасно контактну площадку й вивід і подати припій на з’єднання, а не на жало","Розплавити припій на жалі й перенести краплю","Гріти лише вивід","Паяти без флюсу"],
 "Флюс очищає поверхні й допомагає припою розтектися. Тримай жало 2–3 секунди: надмірне нагрівання відшаровує доріжки.",
 "How do you solder a lead on a board properly?",
 ["Heat the pad and lead together and feed solder to the joint, not to the tip","Melt solder on the tip and carry a drop over","Heat the lead only","Solder without flux"],
 "Flux cleans the surfaces and helps the solder flow. Keep the tip on for 2–3 seconds: overheating lifts the tracks."],
["Яка типова температура жала для пайки електроніки?",
 ["≈ 320–370 °C","≈ 150 °C","≈ 600 °C","≈ 1000 °C"],
 "Для безсвинцевого припою беруть верхню частину діапазону, для олов’яно-свинцевого — нижню. Потрібна витяжка: дим флюсу шкідливий.",
 "What is a typical iron tip temperature for electronics?",
 ["≈ 320–370 °C","≈ 150 °C","≈ 600 °C","≈ 1000 °C"],
 "Lead-free solder needs the upper end of the range, tin-lead the lower. Use fume extraction: flux smoke is harmful."],
["Чим видаляють припій під час демонтажу деталі?",
 ["Відсмоктувачем або обплетенням (оплеткою) з флюсом","Ножем","Стисненим повітрям","Водою"],
 "Обплетення кладуть на пайку, притискають жалом, і мідь вбирає припій. Для багатовивідних деталей зручна термоповітряна станція.",
 "What removes solder when desoldering a part?",
 ["A solder sucker or desoldering braid with flux","A knife","Compressed air","Water"],
 "Lay the braid on the joint and press it with the tip; the copper wicks up the solder. For many-pin parts a hot-air station helps."],
["Перед тим як зняти плату керування з ЧП, що обов’язково?",
 ["LOTO, витримати час розряду з таблички, виміряти напругу DC-шини, одягнути антистатичний браслет","Лише вимкнути вентилятор","Натиснути аварійну кнопку","Нічого, плата низьковольтна"],
 "Конденсатори DC-шини тримають сотні вольтів кілька хвилин. Сфотографуй і підпиши роз’єми до від’єднання, щоб повернути все на місце.",
 "Before removing a VFD’s control board, what is essential?",
 ["LOTO, wait the labelled discharge time, measure the DC bus, wear a wrist strap","Just turn off the fan","Press the E-stop","Nothing, the board is low voltage"],
 "The DC bus capacitors hold hundreds of volts for several minutes. Photograph and label connectors before unplugging so everything goes back correctly."]

    ["Потужність: P = U² / R = I² × R. Беруть резистор із запасом приблизно вдвічі.","Power: P = V² / R = I² × R. Choose about twice the needed rating."]]],
   [["Конденсатори й котушки","Capacitors and inductors"],[

    ["Електролітичні — полярні (смуга й коротший вивід — мінус), керамічні й плівкові — ні. Робоча напруга — із запасом.","Electrolytics are polarized (stripe and shorter lead are negative); ceramic and film are not. Choose the voltage rating with margin."],

    ["Котушка накопичує енергію в магнітному полі й при вимкненні дає викид напруги.","An inductor stores energy in a magnetic field and throws a voltage spike when switched off."]]],
   [["Діоди","Diodes"],[

    ["Стабілітрон тримає сталу напругу у зворотному включенні. Світлодіод має падіння від ≈ 1,8 до ≈ 3,3 В і завжди працює з резистором: R = (U − Uсвітлодіода) / I.","A Zener holds a fixed voltage in reverse. An LED drops ≈ 1.8–3.3 V and always needs a resistor: R = (V − V_LED) / I."]]],

{ id:"elx3", mwa:"D", title:["Силова електроніка, пайка й ремонт","Power electronics, soldering and repair"],
  intro:["Тиристори, симістори, IGBT і твердотільні реле: що стоїть у ЧП, пристроях плавного пуску й регуляторах нагріву. Як перевірити деталі мультиметром, правильно паяти й не вбити плату статикою.",
         "SCRs, TRIACs, IGBTs and solid-state relays: what sits inside drives, soft starters and heater controllers. How to test parts with a meter, solder properly and not kill a board with static."],
  blocks:[
   [["Силові ключі","Power switches"],[
    ["Тиристор (SCR) вмикається імпульсом і вимикається, коли струм падає до нуля. Симістор (TRIAC) — те саме для обох напрямків змінного струму.","An SCR turns on with a pulse and off when current reaches zero. A TRIAC does the same for both directions of AC."],
    ["IGBT — швидкий ключ на великі струми й напруги, основа інвертора ЧП. MOSFET — для нижчих напруг і високих частот.","An IGBT is a fast switch for high current and voltage, the heart of a VFD inverter. A MOSFET suits lower voltages and higher frequencies."],
    ["Твердотільне реле гріється (≈ 1–1,5 В падіння), потребує радіатора й при відмові зазвичай залипає замкненим.","A solid-state relay runs warm (≈ 1–1.5 V drop), needs a heatsink and usually fails shorted."]]],
   [["Всередині ЧП","Inside a VFD"],[
    ["Діодний міст → DC-шина з конденсаторами → інвертор із шести IGBT. Гальмівний чопер скидає енергію гальмування в резистор.","Diode bridge → DC bus with capacitors → inverter of six IGBTs. The brake chopper dumps braking energy into a resistor."],
    ["Перевірка без живлення: після LOTO й розряду DC-шини — діодний тест від L1, L2, L3 і від U, V, W до DC+ і DC−. Мегомметр до електроніки не підключають.","Unpowered check: after LOTO and discharging the DC bus, diode-test from L1, L2, L3 and from U, V, W to DC+ and DC−. Never megger the electronics."]]],
   [["Перевірка деталей мультиметром","Testing parts with a meter"],[
    ["Діод і транзистор — режимом діода (транзистор — як два діоди від бази). Резистор точно міряють, випаявши один вивід.","Diodes and transistors with the diode test (a transistor reads like two diodes from the base). Measure a resistor accurately with one lead lifted."],

/* ---------- dates ---------- */
const pad2 = n => String(n).padStart(2, "0");
function ymd(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function today() { return ymd(new Date()); }
function addDays(s, n) { const [y, m, d] = s.split("-").map(Number); return ymd(new Date(y, m - 1, d + n)); }

/* ---------- progress storage: this browser, plus the viewer's private db doc when available ---------- */
const KEY = "maint-quiz.v1";
const isObj = x => !!x && typeof x === "object" && !Array.isArray(x);
function sanitize(s) {
  s = isObj(s) ? s : {};
  const srs = {};
  if (isObj(s.srs)) for (const [k, v] of Object.entries(s.srs)) if (BY_ID[k] && isObj(v) && typeof v.due === "string") srs[k] = { b: Number(v.b) || 0, due: v.due };
  const prac = {};
  if (isObj(s.prac)) for (const [k, v] of Object.entries(s.prac)) if (Array.isArray(v)) prac[k] = v.map(Boolean);
  const days = {};
  if (isObj(s.days)) for (const [k, v] of Object.entries(s.days)) if (/^\d{4}-\d{2}-\d{2}$/.test(k) && Number(v) > 0) days[k] = Number(v);
  return {
    mistakes: Array.isArray(s.mistakes) ? s.mistakes.filter(id => BY_ID[id]) : [],
    stats: isObj(s.stats) ? s.stats : {},
    last: isObj(s.last) ? s.last : null,
    mods: isObj(s.mods) ? s.mods : {},
    exams: Array.isArray(s.exams) ? s.exams.filter(x => isObj(x) && typeof x.r === "number" && typeof x.t === "number").slice(-10) : [],
    srs, prac, days,
    updatedAt: Number(s.updatedAt) || 0
  };
}
function load() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  const out = sanitize(s);
  out.lang = s && s.lang === "en" ? "en" : "uk";
  return out;
}
const store = load();
function payload(s) { return { v: 3, mistakes: s.mistakes, stats: s.stats, last: s.last, mods: s.mods, exams: s.exams, srs: s.srs, prac: s.prac, days: s.days, updatedAt: s.updatedAt }; }
function stable(o) {
  if (Array.isArray(o)) return "[" + o.map(stable).join(",") + "]";
  if (isObj(o)) return "{" + Object.keys(o).sort().map(k => JSON.stringify(k) + ":" + stable(o[k])).join(",") + "}";
  return JSON.stringify(o === undefined ? null : o);
}
function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
function save() { store.updatedAt = Date.now(); saveLocal(); queueRemote(); }

/* Merge two progress states: best scores, counters, practice and daily totals only grow; lists come from the newer one. */
function merge(a, b) {
  const nb = (b.updatedAt || 0) > (a.updatedAt || 0), newer = nb ? b : a, older = nb ? a : b;
  const keys = (x, y) => new Set(Object.keys(x).concat(Object.keys(y)));
  const mods = {};
  keys(a.mods, b.mods).forEach(id => {
    const n = newer.mods[id] || {}, o = older.mods[id] || {}, m = {};
    if (n.read || o.read) m.read = true;
    const last = n.last != null ? n.last : o.last;
    if (last != null) { m.last = last; m.best = Math.max(n.best || 0, o.best || 0, last); }
    mods[id] = m;
  });
  const stats = {};
  keys(a.stats, b.stats).forEach(id => { const x = a.stats[id], y = b.stats[id]; stats[id] = y && (!x || (y.t || 0) > (x.t || 0)) ? y : x; });
  const seen = new Set(), exams = [];
  a.exams.concat(b.exams).forEach(x => { const k = x.at || (x.d + "|" + x.r + "|" + x.t); if (!seen.has(k)) { seen.add(k); exams.push(x); } });
  exams.sort((x, y) => (x.at || 0) - (y.at || 0));
  const prac = {};
  keys(a.prac, b.prac).forEach(id => { const x = a.prac[id] || [], y = b.prac[id] || [], len = Math.max(x.length, y.length); prac[id] = Array.from({ length: len }, (_, i) => !!(x[i] || y[i])); });
  const days = {};
  keys(a.days, b.days).forEach(d => { days[d] = Math.max(a.days[d] || 0, b.days[d] || 0); });
  const mistakes = newer.mistakes.slice(), srs = {};
  mistakes.forEach(id => { if (newer.srs[id]) srs[id] = newer.srs[id]; });
  return { mistakes, srs, stats, mods, exams: exams.slice(-10), prac, days, last: newer.last || older.last || null, updatedAt: Math.max(a.updatedAt || 0, b.updatedAt || 0) };
}

let syncState = "local", remoteRef = null, writing = false, pendingWrite = false, syncTimer = null, retried = false;
function setSync(s) { syncState = s; renderSync(); }
function queueRemote() { if (!remoteRef) return; clearTimeout(syncTimer); syncTimer = setTimeout(pushRemote, 1200); }
async function pushRemote() {
  if (!remoteRef) return;
  if (writing) { pendingWrite = true; return; }
  writing = true;
  if (!store.updatedAt) { store.updatedAt = Date.now(); saveLocal(); }
  try { await remoteRef.set(payload(store)); retried = false; setSync("on"); }
  catch (e) {
    const code = e && e.code;
    if (code === "unavailable" && !retried) { retried = true; setTimeout(queueRemote, 2000 + Math.random() * 2000); }
    else { if (code !== "unavailable") remoteRef = null; setSync("err"); }
  }
  writing = false;
  if (pendingWrite && remoteRef) { pendingWrite = false; pushRemote(); }
}
function adopt(merged) {
  ["mistakes", "srs", "stats", "mods", "exams", "prac", "days", "last", "updatedAt"].forEach(k => { store[k] = merged[k]; });
  saveLocal();
  if (["learn", "tests", "lesson", "sources", "terms"].includes(st.view)) render();
}
async function initSync() {
  const C = window.claude;
  if (!C || typeof C.use !== "function") return;
  setSync("wait");
  let db = null, user = null, uid = null;
  try { [db, user] = await Promise.all([C.use("db"), C.use("user")]); } catch (e) {}
  try { uid = user ? await user.id() : null; } catch (e) {}
  if (!db || !uid) { setSync("local"); return; }
  let ref;
  try { ref = db.doc("data/users/" + uid + "/progress"); } catch (e) { setSync("local"); return; }
  remoteRef = ref;
  const timer = setTimeout(() => { if (syncState === "wait") setSync("err"); }, 10000);
  ref.onSnapshot(snap => {
    if (snap.metadata.hasPendingWrites) return;
    if (!snap.metadata.fromCache) clearTimeout(timer);
    if (!snap.exists) { if (!snap.metadata.fromCache && remoteRef) pushRemote(); return; }
    const remote = sanitize(snap.data());
    if (stable(payload(remote)) === stable(payload(store))) { if (!snap.metadata.fromCache) setSync("on"); return; }
    const merged = merge(store, remote);
    const differsFromRemote = stable(Object.assign(payload(merged), { updatedAt: 0 })) !== stable(Object.assign(payload(remote), { updatedAt: 0 }));
    adopt(merged);
    if (differsFromRemote && !snap.metadata.fromCache) { store.updatedAt = Date.now(); saveLocal(); pushRemote(); }
    else if (!snap.metadata.fromCache) setSync("on");
  }, () => { clearTimeout(timer); remoteRef = null; setSync("err"); });
}

/* ---------- spaced review of mistakes and daily goal ---------- */
const SRS_STEPS = [1, 3];
function markAnswer(q, ok) {
  if (q.gen) return;
  const inM = store.mistakes.includes(q.id), d = today();
  if (!ok) { if (!inM) store.mistakes.push(q.id); store.srs[q.id] = { b: 0, due: d }; return; }
  if (!inM) return;
  const s = store.srs[q.id] || { b: 0, due: d };
  if (s.due > d) return;
  const b = s.b + 1;
  if (b >= 3) { store.mistakes = store.mistakes.filter(id => id !== q.id); delete store.srs[q.id]; }
  else store.srs[q.id] = { b, due: addDays(d, SRS_STEPS[b - 1]) };
}
function dueList() { const d = today(); return store.mistakes.filter(id => { const s = store.srs[id]; return !s || s.due <= d; }); }
function nextDue() { const ds = store.mistakes.map(id => store.srs[id] && store.srs[id].due).filter(Boolean).sort(); return ds[0] || null; }
function bumpDay(n) {
  const d = today(); store.days[d] = (store.days[d] || 0) + n;
  const ks = Object.keys(store.days).sort(); while (ks.length > 120) delete store.days[ks.shift()];
}
function streak() {
  let d = today(), n = 0;
  if ((store.days[d] || 0) < GOAL) d = addDays(d, -1);
  while ((store.days[d] || 0) >= GOAL) { n++; d = addDays(d, -1); }
  return n;
}
function examReady() {
  return store.exams.slice(-3).filter(x => x.t >= 50 && pct(x.r, x.t) >= 70 && Object.values(x.b || {}).every(v => pct(v[0], v[1]) >= 70)).length;
}

function esc(s) { return String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch])); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pct(r, n) { return n ? Math.round(r / n * 100) : 0; }

/* ---------- PLC lab: a tiny FX-like scan engine with a ladder monitor ---------- */
const lab = { sc: 0, dev: {}, acc: {}, prev: {}, rv: {}, pressed: {}, tog: {}, fault: {}, tick: 0, pos: 0, timer: null };
function labReset(k) { Object.assign(lab, { sc: LAB[k] ? k : 0, dev: {}, acc: {}, prev: {}, rv: {}, pressed: {}, tog: {}, fault: {}, tick: 0, pos: 0 }); }
function labVal(c) { const nc = c[0] === "!", v = !!lab.dev[nc ? c.slice(1) : c]; return nc ? !v : v; }
function labEval(e) { if (typeof e === "string") return labVal(e); if (Array.isArray(e)) return e.every(labEval); return e.p.some(labEval); }
function labScan() {
  const sc = LAB[lab.sc]; if (!sc) return;
  lab.tick++;
  for (const i of sc.inputs) {
    let v = false;
    if (i.t === "push") v = !!lab.pressed[i.d];
    else if (i.t === "ncpush") v = !lab.pressed[i.d];
    else if (i.t === "toggle") v = !!lab.tog[i.d];
    else if (i.t === "nctoggle") v = !lab.tog[i.d];
    else if (i.t === "sensor") v = !!i.f(lab) && !lab.fault[i.d];
    lab.dev[i.d] = v;
  }
  lab.dev.M8013 = lab.tick % 10 < 5;
  sc.prog.forEach((r, ri) => {
    const v = labEval(r.c), o = r.o, d = o.d, p = !!lab.prev[ri];
    if (o.op === "OUT") lab.dev[d] = v;
    else if (o.op === "SET") { if (v) lab.dev[d] = true; }
    else if (o.op === "RST") { if (v) { lab.dev[d] = false; lab.acc[d] = 0; } }
    else if (o.op === "TMR") { lab.acc[d] = v ? Math.min((lab.acc[d] || 0) + 1, o.k) : 0; lab.dev[d] = lab.acc[d] >= o.k; }
    else if (o.op === "CNT") { if (v && !p && (lab.acc[d] || 0) < o.k) lab.acc[d] = (lab.acc[d] || 0) + 1; lab.dev[d] = (lab.acc[d] || 0) >= o.k; }
    lab.prev[ri] = v; lab.rv[ri] = v;

  if (sc.phys) sc.phys(lab);

}
function labPaint() {
  const root = $("lab"); if (!root || !root.querySelectorAll) return;
  root.querySelectorAll("[data-led]").forEach(e => e.classList.toggle("on", !!lab.dev[e.dataset.led]));
  root.querySelectorAll("[data-c]").forEach(e => e.classList.toggle("on", labVal(e.dataset.c)));
  root.querySelectorAll("[data-coil]").forEach(e => e.classList.toggle("on", !!lab.rv[e.dataset.coil]));
  root.querySelectorAll("[data-tv]").forEach(e => {
    const k = Number(e.dataset.k), a = lab.acc[e.dataset.tv] || 0;
    e.textContent = e.dataset.op === "TMR" ? fmtN(a / 10, 1, lang) + " / " + fmtN(k / 10, 1, lang) + t().labUnit : a + " / " + k;
  });
  const rod = root.querySelector("[data-rod]"); if (rod) rod.setAttribute("width", String(12 + lab.pos * 150));
}
function labStart() { if (!lab.timer) lab.timer = setInterval(labScan, 100); labScan(); }
function labStop() { if (lab.timer) { clearInterval(lab.timer); lab.timer = null; } lab.pressed = {}; }
function labPress(b, on) { lab.pressed[b.dataset.push] = on; b.classList.toggle("down", on); }

function ladderSvg(sc) {
  const CW = 64, RH = 46, PX = 12, CM = 20, X0 = 14, COILW = 124, P = [];
  const lay = e => {
    if (typeof e === "string") return { w: CW, h: RH };
    if (Array.isArray(e)) return e.reduce((s, x) => { const z = lay(x); return { w: s.w + z.w, h: Math.max(s.h, z.h) }; }, { w: 0, h: RH });
    return e.p.reduce((s, x) => { const z = lay(x); return { w: Math.max(s.w, z.w + 2 * PX), h: s.h + z.h }; }, { w: 2 * PX, h: 0 });
  };
  const ln = (x1, y1, x2, y2) => P.push(`<path class="w" d="M${x1} ${y1}L${x2} ${y2}"/>`);
  const draw = (e, x, top) => {
    const wy = top + RH / 2;
    if (typeof e === "string") {
      const nc = e[0] === "!", d = nc ? e.slice(1) : e;
      ln(x, wy, x + 24, wy); ln(x + 40, wy, x + CW, wy);
      P.push(`<rect class="cell" data-c="${e}" x="${x + 25}" y="${wy - 11}" width="14" height="22"/>`);
      ln(x + 24, wy - 12, x + 24, wy + 12); ln(x + 40, wy - 12, x + 40, wy + 12);
      if (nc) ln(x + 19, wy + 14, x + 45, wy - 14);
      P.push(`<text x="${x + 32}" y="${wy - 17}" text-anchor="middle">${d}</text>`);
      return;
    }
    if (Array.isArray(e)) { let cx = x; e.forEach(z => { draw(z, cx, top); cx += lay(z).w; }); return; }
    const W = lay(e).w; let cy = top, lastWy = wy;
    e.p.forEach(br => { const s = lay(br), by = cy + RH / 2; ln(x, by, x + PX, by); draw(br, x + PX, cy); ln(x + PX + s.w, by, x + W, by); lastWy = by; cy += s.h; });
    ln(x, wy, x, lastWy); ln(x + W, wy, x + W, lastWy);
  };
  const conds = sc.prog.map(r => lay(r.c));
  const XC = X0 + Math.max(...conds.map(s => s.w)) + 20, XR = XC + COILW + 10, W = XR + 12;
  let y = 4;
  sc.prog.forEach((r, ri) => {
    const s = conds[ri], top = y + CM, wy = top + RH / 2, o = r.o;
    if (r.n) P.push(`<text class="cm" x="${X0 + 8}" y="${y + 14}">${esc(L(r.n))}</text>`);
    draw(r.c, X0, top);
    ln(X0 + s.w, wy, XC, wy);
    if (o.op === "OUT") {
      ln(XC, wy, XC + 48, wy); ln(XC + 76, wy, XC + COILW, wy);
      P.push(`<circle class="w coil" data-coil="${ri}" cx="${XC + 62}" cy="${wy}" r="14"/><text x="${XC + 62}" y="${wy - 19}" text-anchor="middle">${o.d}</text>`);
    } else {
      const label = o.op === "TMR" || o.op === "CNT" ? o.d + " K" + o.k : o.op + " " + o.d;
      ln(XC, wy, XC + 8, wy); ln(XC + 116, wy, XC + COILW, wy);
      P.push(`<rect class="w coil" data-coil="${ri}" x="${XC + 8}" y="${wy - 13}" width="108" height="26" rx="3"/><text x="${XC + 62}" y="${wy + 5}" text-anchor="middle">${label}</text>`);
    }
    ln(XC + COILW, wy, XR, wy);
    y = top + s.h + 4;
  });
  P.unshift(`<path class="w rail" d="M${X0} 2V${y}M${XR} 2V${y}"/>`);
  return `<svg width="${W}" height="${y + 2}" viewBox="0 0 ${W} ${y + 2}" role="img" aria-label="${esc(t().labProg)}">${P.join("")}</svg>`;
}
function cylSvg(sc) {
  return `<svg class="cyl" viewBox="0 0 360 76" role="img" aria-label="${esc(L(sc.t))}">
    <rect class="w" x="20" y="30" width="150" height="36" rx="4"/>
    <rect class="rod" data-rod x="170" y="42" width="12" height="12"/>
    <circle class="sen" data-led="X2" cx="182" cy="13" r="7"/><text x="195" y="18">X2</text>
    <circle class="sen" data-led="X1" cx="332" cy="13" r="7"/><text x="319" y="18" text-anchor="end">X1</text></svg>`;

/* ---------- practice quiz (feedback after every answer) ---------- */
function startQuiz(pool, origin) {
  pool = shuffle(pool.slice());
  if (!pool.length) return;
  Object.assign(st, { queue: pool, i: 0, score: 0, wrong: [], origin, view: "quiz", active: true });
  prepare(); render(); scrollTop();
}
function prepare() { st.opts = shuffle(qOpts(st.queue[st.i]).map((_, i) => i)); st.picked = null; }

function renderQuiz() {
  const q = st.queue[st.i], n = st.queue.length, done = st.picked !== null, opts = qOpts(q);
  const head = st.origin.type === "module" ? t().checkOf(modTitle(st.origin.id)) : st.origin.type === "review" ? t().mistakesHead : st.origin.type === "calc" ? t().calcTitle : "";
  const buttons = st.opts.map((oi, k) => {
    let cls = "opt";
    if (done) { if (oi === 0) cls += " correct"; else if (k === st.picked) cls += " wrong"; else cls += " dim"; }
    return `<button class="${cls}" data-act="pick" data-k="${k}" ${done ? "disabled" : ""}><span class="k">${k + 1}</span><span>${esc(opts[oi])}</span></button>`;
  }).join("");
  let explain = "";
  if (done) {
    const ok = st.opts[st.picked] === 0;
    explain = `<div class="explain ${ok ? "" : "bad"}"><h3>${ok ? esc(t().right) : esc(t().wrong + opts[0])}</h3><p>${esc(qExp(q))}</p></div>
      <div class="row"><button class="btn wide" data-act="next" id="nextBtn">${esc(st.i + 1 < n ? t().next : t().showResult)}</button></div>`;
  }
  app.innerHTML = `
    ${head ? `<p class="label">${esc(head)}</p>` : ""}
    <div class="qhead"><span class="num">${esc(t().qOf(st.i + 1, n))}</span>
      <span class="row" style="gap:12px"><span class="num">${esc(t().correctN(st.score))}</span><button class="link" data-act="quit">${esc(t().exit)}</button></span></div>
    ${bar(st.i + (done ? 1 : 0), n)}
    <span class="tag">${esc(modTitle(q.c))}</span>
    <h2 class="q" id="qText" tabindex="-1">${esc(qText(q))}</h2>
    ${diagHtml(q)}
    <div class="opts" role="group" aria-labelledby="qText">${buttons}</div>
    ${done ? "" : `<p class="kbd-hint small muted">${esc(t().kbd)}</p>`}
    ${explain}`;
}

function pick(k) {
  if (st.view !== "quiz" || st.picked !== null || st.opts[k] == null) return;
  st.picked = k;
  const q = st.queue[st.i], ok = st.opts[k] === 0;
  const s = store.stats[q.c] || (store.stats[q.c] = { r: 0, t: 0 });
  s.t++;
  if (ok) { s.r++; st.score++; } else st.wrong.push({ q, a: st.opts[k] });
  markAnswer(q, ok); bumpDay(1);
  save(); render();
  announce(ok ? t().right : t().wrong + qOpts(q)[0]);
  const b = $("nextBtn");
  if (b) { b.focus({ preventScroll: true }); try { b.scrollIntoView({ block: "nearest", behavior: smooth() }); } catch (e) {} }
}

function next() {
  if (st.picked === null) return;
  st.i++;
  if (st.i < st.queue.length) {
    prepare(); render(); ensureTop();
    const h = $("qText"); if (h) h.focus({ preventScroll: true });
    return;
  }
  const n = st.queue.length, p = pct(st.score, n);
  store.last = { r: st.score, t: n, d: today() };
  if (st.origin.type === "module") {
    const m = store.mods[st.origin.id] || {};
    m.read = true; m.last = p; m.best = Math.max(m.best || 0, p);
    store.mods[st.origin.id] = m;
  }
  st.active = false;
  save(); st.view = "result"; render(); scrollTop();
}

function missItem(q, a) {

}

/* ---------- mock exam (RSOS-weighted, feedback only at the end) ---------- */
function blockOf(c) { const b = MWA.find(x => x[2].includes(c)); return b ? b[0] : "A"; }
function buildExam(n) {
  const w = MWA.map(([, p]) => p * n / 100), cnt = w.map(Math.floor);
  const rest = n - cnt.reduce((a, b) => a + b, 0);
  w.map((x, i) => [x - cnt[i], i]).sort((a, b) => b[0] - a[0] || a[1] - b[1]).slice(0, rest).forEach(([, i]) => cnt[i]++);
  const used = new Set(), qs = [];
  MWA.forEach(([b, , mods], i) => {
    shuffle(BANK.filter(q => mods.includes(q.c) && !used.has(q.id))).slice(0, cnt[i]).forEach(q => { used.add(q.id); qs.push({ q, b }); });
  });
  if (qs.length < n) shuffle(BANK.filter(q => EXAM_MODS.includes(q.c) && !used.has(q.id))).slice(0, n - qs.length)
    .forEach(q => { used.add(q.id); qs.push({ q, b: blockOf(q.c) }); });
  return shuffle(qs);
}
function startExam() {
  const qs = buildExam(st.examLen);
  st.exam = { qs, ans: qs.map(() => null), perm: qs.map(it => shuffle(qOpts(it.q).map((_, i) => i))), i: 0, acc: 0, t0: 0, running: false, confirm: false };
  Object.assign(st, { tab: "tests", view: "exam" }); render(); scrollTop();
}
function examSec() { const ex = st.exam; if (!ex) return 0; return (ex.acc + (ex.running ? Date.now() - ex.t0 : 0)) / 1000; }
function pauseExam() { const ex = st.exam; if (ex && ex.running) { ex.acc += Date.now() - ex.t0; ex.running = false; } }

function renderExam() {
  const ex = st.exam, n = ex.qs.length, it = ex.qs[ex.i], q = it.q, opts = qOpts(q), sel = ex.ans[ex.i];
  if (!ex.running && !document.hidden) { ex.t0 = Date.now(); ex.running = true; }
  const answered = ex.ans.filter(a => a != null).length, last = ex.i === n - 1;
  const buttons = ex.perm[ex.i].map((oi, k) => `<button class="opt" data-act="xpick" data-k="${k}" aria-pressed="${sel === oi}"><span class="k">${k + 1}</span><span>${esc(opts[oi])}</span></button>`).join("");
  const grid = ex.qs.map((_, j) => `<button data-act="xgo" data-j="${j}" class="${ex.ans[j] != null ? "done" : ""}"${j === ex.i ? ' aria-current="step"' : ""} aria-label="${esc(t().jump(j + 1))}">${j + 1}</button>`).join("");
  const confirmBox = ex.confirm
    ? `<div class="warnbox" id="confirmBox"><p class="m0">${esc(t().unanswered(nQ(n - answered)))}</p><div class="row"><button class="btn" data-act="xfinish2">${esc(t().finishAnyway)}</button><button class="btn ghost" data-act="xunans">${esc(t().keepGoing)}</button></div></div>`
    : "";
  app.innerHTML = `
    <p class="label">${esc(t().mockTitle)}</p>
    <div class="qhead"><span class="num">${esc(t().qOf(ex.i + 1, n))}</span>
      <span class="row" style="gap:12px"><span class="num">${esc(t().timeL)} <span id="timer">${fmtTime(examSec())}</span></span><button class="link" data-act="xquit">${esc(t().exit)}</button></span></div>
    ${bar(answered, n)}
    <span class="tag">${esc(t().block(it.b))}</span>
    <h2 class="q" id="qText" tabindex="-1">${esc(qText(q))}</h2>
    ${diagHtml(q)}
    <div class="opts" role="group" aria-labelledby="qText">${buttons}</div>
    <div class="row">
      <button class="btn ghost" data-act="xprev" ${ex.i ? "" : "disabled"}>${esc(t().prev)}</button>
      ${last ? `<button class="btn wide" data-act="xfinish">${esc(t().finish)}</button>` : `<button class="btn wide" data-act="xnext">${esc(t().nextQ)}</button>`}
    </div>
    ${confirmBox}
    <p class="kbd-hint small muted">${esc(t().kbdExam)}</p>
    <div class="row between small"><span class="muted num">${esc(t().answeredN(answered, n))}</span>${last ? "" : `<button class="link" data-act="xfinish">${esc(t().finish)}</button>`}</div>
    <div class="qnav" role="group" aria-label="${esc(t().gridLabel)}">${grid}</div>`;
}
function xpick(k) {
  const ex = st.exam; if (!ex || st.view !== "exam") return;
  const oi = ex.perm[ex.i][k]; if (oi == null) return;
  ex.ans[ex.i] = oi; ex.confirm = false; render();
}
function xgo(j) {
  const ex = st.exam; if (!ex || j < 0 || j >= ex.qs.length) return;
  ex.i = j; ex.confirm = false; render(); ensureTop();
}
function xfinish() {
  const ex = st.exam; if (!ex) return;
  if (ex.ans.some(a => a == null)) {
    ex.confirm = true; render();
    const box = $("confirmBox"); if (box) { try { box.scrollIntoView({ block: "nearest", behavior: smooth() }); } catch (e) {} }
    return;
  }
  finishExam();
}
function finishExam() {
  const ex = st.exam; if (!ex) return;
  pauseExam();
  let r = 0; const blocks = {}, wrong = [];
  ex.qs.forEach((it, j) => {
    const ok = ex.ans[j] === 0;
    const b = blocks[it.b] || (blocks[it.b] = [0, 0]); b[1]++;
    const s = store.stats[it.q.c] || (store.stats[it.q.c] = { r: 0, t: 0 }); s.t++;
    if (ok) { b[0]++; r++; s.r++; } else wrong.push({ q: it.q, a: ex.ans[j] });
    markAnswer(it.q, ok);
  });
  bumpDay(ex.ans.filter(a => a != null).length);
  const rec = { d: today(), r, t: ex.qs.length, s: Math.round(ex.acc / 1000), b: blocks, at: Date.now() };
  store.exams = store.exams.concat(rec).slice(-10);
  store.last = { r, t: rec.t, d: rec.d };
  st.examResult = { rec, wrong };
  st.exam = null; st.view = "examResult"; save(); render(); scrollTop();
}
function renderExamResult() {
  const { rec, wrong } = st.examResult, p = pct(rec.r, rec.t), pass = p >= 70, due = dueList().length;
  const rows = MWA.map(([b]) => [b, rec.b[b]]).filter(([, v]) => v && v[1]);
  const blocksHtml = rows.map(([b, [r, n]]) => { const bp = pct(r, n); return `<div class="stat"><span><strong>${b}</strong> · ${esc(t().mwa[b])}</span><span class="num muted">${bp} % · ${r}/${n}</span>${meter(bp)}</div>`; }).join("");
  const weak = rows.map(([b, [r, n]]) => [b, pct(r, n)]).filter(x => x[1] < 70).sort((a, b) => a[1] - b[1])[0];
  const weakMods = weak ? MWA.find(x => x[0] === weak[0])[2] : [];
  const advice = weak
    ? `<p class="m0">${esc(t().weakest(weak[0] + " (" + t().mwa[weak[0]] + ")"))}</p><div class="row">${weakMods.map(id => `<button class="chip" data-act="open" data-mod="${id}">${esc(modTitle(id))}</button>`).join("")}</div>`
    : `<p class="m0">${esc(t().allBlocksOk)}</p>`;
  const list = wrong.length
    ? `<p class="label">${esc(t().review)}</p><ul class="miss">${wrong.map(x => missItem(x.q, x.a)).join("")}</ul>`
    : `<p class="m0">${esc(t().noMistakes)}</p>`;
  app.innerHTML = `
    ${resumeBanner()}
    <p class="label">${esc(t().mockTitle)} · <span class="num">${esc(rec.d)}</span></p>
    <div class="score"><b>${rec.r} / ${rec.t}</b><span class="num" style="font-size:22px">${p} %</span><span class="num muted">${esc(t().timeL)} ${fmtTime(rec.s)}</span></div>
    <div class="row"><span class="pill ${pass ? "ok" : "no"}">${esc(pass ? t().passPill : t().failPill)}</span></div>
    <p class="label">${esc(t().byBlock)}</p>
    <div class="stats">${blocksHtml}</div>
    ${advice}
    <div class="row">
      <button class="btn wide" data-act="xstart">${esc(t().mockAgain)}</button>
      <button class="btn ghost wide" data-act="reviewq" ${due ? "" : "disabled"}>${esc(t().reviewBtn(due))}</button>
    </div>
    <div class="row"><button class="link" data-act="tab" data-tab="tests">${esc(t().toTests)}</button></div>
    ${list}`;
}

      <ul class="facts">${t().examFacts.map(f => `<li>${esc(f)}</li>`).join("")}</ul>
      <div class="tbl"><table><thead><tr>${t().mwaHead.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>
      <p class="small muted m0">${esc(t().mwaNote)}</p>
    </section>
    <section class="blk"><h3>${esc(t().secExam)}</h3><ul class="src">${sec("exam")}</ul></section>
    <section class="blk"><h3>${esc(t().secCode)}</h3><ul class="src">${sec("code")}</ul></section>
    <section class="blk"><h3>${esc(t().secBook)}</h3><p class="small muted m0">${esc(t().bookNote)}</p><ul class="src">${sec("book")}</ul></section>
    <section class="blk"><h3>${esc(t().secEquip)}</h3><ul class="src">${sec("equip")}</ul></section>`;
}

/* ---------- render loop & events ---------- */
const FOCUS_ATTRS = ["act", "k", "j", "tab", "cat", "len", "lang", "mod"];
function focusKey(el) { return el && el.dataset && el.dataset.act ? FOCUS_ATTRS.map(a => el.dataset[a] || "").join("|") : null; }
function render() {
  const fk = focusKey(document.activeElement);
  if (st.exam && st.view !== "exam") pauseExam();
  if (!(st.view === "lesson" && MOD[st.mod] && MOD[st.mod].lab)) labStop();
  renderChrome();
  if (st.view === "lesson" && MOD[st.mod]) renderLesson();
  else if (st.view === "quiz" && st.queue.length) renderQuiz();
  else if (st.view === "result" && st.origin) renderResult();
  else if (st.view === "exam" && st.exam) renderExam();
  else if (st.view === "examResult" && st.examResult) renderExamResult();
  else if (st.view === "tests") renderTests();
  else if (st.view === "terms") renderTerms();
  else if (st.view === "sources") renderSources();
  else { st.view = "learn"; renderLearn(); }
  if (fk) {
    const m = Array.from(document.querySelectorAll("[data-act]")).find(x => !x.disabled && focusKey(x) === fk);
    if (m) m.focus({ preventScroll: true });
  }
}

function openModule(id) {
  if (!MOD[id]) return;
  const m = store.mods[id] || {}; m.read = true; store.mods[id] = m; save();
  Object.assign(st, { tab: "learn", view: "lesson", mod: id }); render(); scrollTop();
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === "lang") { lang = b.dataset.lang === "en" ? "en" : "uk"; store.lang = lang; saveLocal(); render(); }
  else if (a === "tab") { st.tab = b.dataset.tab; st.view = b.dataset.tab; render(); scrollTop(); }
  else if (a === "open") openModule(b.dataset.mod);
  else if (a === "home") { Object.assign(st, { tab: "learn", view: "learn" }); render(); scrollTop(); }
  else if (a === "check") startQuiz(modQ(st.mod), { type: "module", id: st.mod });
  else if (a === "again") startQuiz(modQ(st.origin.id), { type: "module", id: st.origin.id });
  else if (a === "lesson") openModule(st.origin.id);
  else if (a === "ptask") { const arr = store.prac[b.dataset.mod] || (store.prac[b.dataset.mod] = []); const k = Number(b.dataset.k); while (arr.length <= k) arr.push(false); arr[k] = !!b.checked; save(); }
  else if (a === "cat") { const c = b.dataset.cat; st.cats.has(c) ? st.cats.delete(c) : st.cats.add(c); render(); }
  else if (a === "allcats") { st.cats = new Set(MODULES.map(m => m.id)); render(); }
  else if (a === "nocats") { st.cats.clear(); render(); }
  else if (a === "len") { st.len = b.dataset.len === "all" ? "all" : Number(b.dataset.len); render(); }
  else if (a === "mixed") {
    let pool = shuffle(BANK.filter(q => st.cats.has(q.c)));
    if (st.len !== "all") pool = pool.slice(0, st.len);
    st.tab = "tests"; startQuiz(pool, { type: "mixed" });
  }
  else if (a === "calc") { st.tab = "tests"; startQuiz(makeCalcSet(10), { type: "calc" }); }
  else if (a === "reviewq") { const due = new Set(dueList()); if (!due.size) return; st.tab = "tests"; startQuiz(BANK.filter(q => due.has(q.id)), { type: "review" }); }
  else if (a === "pick") pick(Number(b.dataset.k));
  else if (a === "next") next();
  else if (a === "quit") {
    st.active = false;
    if (st.origin && st.origin.type === "module") openModule(st.origin.id);
    else { Object.assign(st, { tab: "tests", view: "tests" }); render(); scrollTop(); }
  }
  else if (a === "qresume") { st.tab = st.origin && st.origin.type === "module" ? "learn" : "tests"; st.view = "quiz"; render(); scrollTop(); }
  else if (a === "xlen") { const v = Number(b.dataset.len); st.examLen = [25, 50, 100].includes(v) ? v : 50; render(); }
  else if (a === "xstart") startExam();
  else if (a === "xresume") { Object.assign(st, { tab: "tests", view: "exam" }); render(); scrollTop(); }
  else if (a === "xpick") xpick(Number(b.dataset.k));
  else if (a === "xnext" && st.exam) xgo(st.exam.i + 1);
  else if (a === "xprev" && st.exam) xgo(st.exam.i - 1);
  else if (a === "xgo") xgo(Number(b.dataset.j));
  else if (a === "xfinish") xfinish();
  else if (a === "xfinish2") finishExam();
  else if (a === "xunans" && st.exam) xgo(Math.max(0, st.exam.ans.findIndex(x => x == null)));
  else if (a === "xquit") { Object.assign(st, { tab: "tests", view: "tests" }); render(); scrollTop(); }
  else if (a === "tcat") { st.termCat = b.dataset.cat; renderTerms(); }
  else if (a === "bkfile") {
    try {
      const url = URL.createObjectURL(new Blob([exportText()], { type: "application/json" }));
      const link = document.createElement("a");
      link.href = url; link.download = "trainer-progress-" + today() + ".json";
      document.body.appendChild(link); link.click();
      setTimeout(() => { URL.revokeObjectURL(url); link.remove(); }, 1000);
      bkMessage(t().bkSaved);
    } catch (e) { bkMessage(t().bkSelect); }
  }
  else if (a === "bkcopy") {
    const text = exportText(), ta = $("bkText"), det = $("bkDetails");
    if (ta) ta.value = text;
    const fallback = () => { if (det) det.open = true; if (ta) { ta.focus(); ta.select(); } bkMessage(t().bkSelect); };
    try { navigator.clipboard.writeText(text).then(() => bkMessage(t().bkCopied), fallback); } catch (e) { fallback(); }
  }
  else if (a === "bkopen") { const inp = $("bkInput"); if (inp) inp.click(); }
  else if (a === "bkapply") { const ta = $("bkText"); importProgress(ta ? ta.value : ""); }
  else if (a === "install") {
    const ev = window.__installEvt; window.__installEvt = null;
    if (ev) { ev.prompt(); render(); }
  }
  else if (a === "lsc") { labReset(Number(b.dataset.k) || 0); render(); }
  else if (a === "lreset") { labReset(lab.sc); render(); }
  else if (a === "ltog" || a === "lfault") {
    const m = a === "ltog" ? lab.tog : lab.fault, d = b.dataset.d;
    m[d] = !m[d]; b.setAttribute("aria-pressed", String(!!m[d])); labScan();
  }
});
document.addEventListener("pointerdown", e => {
  const b = e.target && e.target.closest && e.target.closest("[data-push]"); if (!b) return;
  e.preventDefault(); labPress(b, true);
  try { b.setPointerCapture(e.pointerId); } catch (x) {}
  labScan();
});
const labRelease = () => document.querySelectorAll("[data-push].down").forEach(b => labPress(b, false));
document.addEventListener("pointerup", labRelease);
document.addEventListener("pointercancel", labRelease);
document.addEventListener("keyup", e => {
  const b = e.target && e.target.closest && e.target.closest("[data-push]");
  if (b && (e.key === " " || e.key === "Enter")) { e.preventDefault(); labPress(b, false); }
});
document.addEventListener("focusout", e => { if (e.target && e.target.matches && e.target.matches("[data-push].down")) labPress(e.target, false); });
document.addEventListener("input", e => {
  if (e.target && e.target.id === "termSearch") { st.termQ = e.target.value; renderTermList(); }
});
document.addEventListener("change", e => {
  const inp = e.target;
  if (!inp || inp.id !== "bkInput" || !inp.files || !inp.files[0]) return;
  const r = new FileReader();
  r.onload = () => importProgress(r.result);
  r.onerror = () => bkMessage(t().bkBad);
  r.readAsText(inp.files[0]);
  inp.value = "";
});
document.addEventListener("keydown", e => {
  const pb = e.target && e.target.closest && e.target.closest("[data-push]");
  if (pb && (e.key === " " || e.key === "Enter")) { e.preventDefault(); if (!e.repeat) { labPress(pb, true); labScan(); } return; }
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const ae = document.activeElement;
  const onControl = !!(ae && ae !== document.body && ae.closest && ae.closest("button, a, input, textarea, select, label"));
  if (st.view === "quiz") {
    if (/^[1-4]$/.test(e.key) && st.picked === null) { e.preventDefault(); pick(Number(e.key) - 1); }
    else if (e.key === "Enter" && st.picked !== null && !onControl) { e.preventDefault(); next(); }
  } else if (st.view === "exam" && st.exam) {
    if (ae && ae.tagName === "INPUT") return;
    if (/^[1-4]$/.test(e.key)) { e.preventDefault(); xpick(Number(e.key) - 1); }
    else if (e.key === "ArrowRight") { e.preventDefault(); xgo(st.exam.i + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); xgo(st.exam.i - 1); }
    else if (e.key === "Enter" && !onControl) { e.preventDefault(); st.exam.i < st.exam.qs.length - 1 ? xgo(st.exam.i + 1) : xfinish(); }
  }
});
document.addEventListener("visibilitychange", () => {
  const ex = st.exam; if (!ex || st.view !== "exam") return;
  if (document.hidden) pauseExam(); else if (!ex.running) { ex.t0 = Date.now(); ex.running = true; }
});
setInterval(() => { const el = $("timer"); if (el && st.exam && st.view === "exam") el.textContent = fmtTime(examSec()); }, 1000);

render();
initSync();
</script>

<script>
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
